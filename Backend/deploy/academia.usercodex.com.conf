<VirtualHost *:80>
    ServerName academia.usercodex.com

    DocumentRoot /home/usercodex/academia_front
    <Directory /home/usercodex/academia_front>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /api/ http://127.0.0.1:8001/api/

    ProxyPass /media/ http://127.0.0.1:8001/media/
    ProxyPassReverse /media/ http://127.0.0.1:8001/media/

    Alias /static/ /home/usercodex/academia_src/Backend/staticfiles/
    <Directory /home/usercodex/academia_src/Backend/staticfiles>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/academia_error.log
    CustomLog ${APACHE_LOG_DIR}/academia_access.log combined
</VirtualHost>
