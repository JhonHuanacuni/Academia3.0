<VirtualHost *:80>
    ServerName academia.usercodex.com

    DocumentRoot /home/usercodex/academia_front
    <Directory /home/usercodex/academia_front>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8003/api/
    ProxyPassReverse /api/ http://127.0.0.1:8003/api/

    # Archivos subidos (PDF biblioteca, portadas). Servir desde disco, no vía Gunicorn.
    ProxyPass /media/ !
    Alias /media/ /home/usercodex/academia_src/Backend/media/
    <Directory /home/usercodex/academia_src/Backend/media>
        Options -Indexes
        Require all granted
    </Directory>

    Alias /static/ /home/usercodex/academia_src/Backend/staticfiles/
    <Directory /home/usercodex/academia_src/Backend/staticfiles>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/academia_error.log
    CustomLog ${APACHE_LOG_DIR}/academia_access.log combined
</VirtualHost>
